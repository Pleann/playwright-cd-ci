name: Playwright Test (shared)
on: 
    push:
        -main

        # schedule:
        #       - cron: ' 0 2 * * * '
jobs:
    test: 
        timeout-minute: 60
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                sharedIndex: [1,2,3,4]
                sharedTest: [4]
steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test --shard=${{matrix.sharedIndex}}//${{matrix.sharedTotal}}
      - name: upload Playwright test results
        if: ${{cancelled}}
        with:
        name: playwright-report
        path: playwright-report/
        retention-days: 1

        merge-reports:
          if: ${{cancelled}}
          needs: [test]
          runs-on: ubuntu-latest
          steps: 
              - uses: actions/checkout@v4
              - uses: actions/setup-node@v4
                with:
                  node-version: lts/*
                  cache: 'npm'
              - name: Install dependencies
                run: npm ci
              - name: Download the blob reports
                uses: actions/download-artifact@v4
                with:
                  path: all-blob-reports
                  pattern: blob-report-*
                  merge-multiple: true
              - name: merge the blob reports
                run: npxplaywright merge-report --reporter html ./all-blob-report
              - name: upload the merge html report 
                uses: actions/upload-artifact@v4
                with: 
                  name: html-report--attemp-${{ github.run_attempt }}
                  path: playwright-reports
                  retention-days: 14